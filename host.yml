---
all:
  vars:
    ansible_user: vagrant
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  children:
    prod:
      hosts:
        client1:
          ansible_host: 192.168.99.21
          ansible_private_key_file: /home/vagrant/.ssh/client1_private_key
    staging:
      hosts:
        client2:
          ansible_host: 192.168.99.22
          ansible_private_key_file: /home/vagrant/.ssh/client2_private_key
